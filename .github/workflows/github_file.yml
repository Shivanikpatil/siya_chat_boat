on:
  pull_request:
    branches:
      - main
      - master
      - new_code
  push:
    branches:
      - main
      - master
      - new_code

name: "Build & Release"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← Fix for Node.js 20 deprecation

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.2        # ← updated
      - uses: actions/setup-java@v4.7.0      # ← updated
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build Windows
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Archive Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\x64\runner\Release\messanger-windows.zip

